version: "3.9"

services:
  db:
    image: postgres:16
    container_name: poojaseva-db
    environment:
      POSTGRES_USER: poojaseva
      POSTGRES_PASSWORD: poojaseva
      POSTGRES_DB: poojaseva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: poojaseva-api
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: ["/bin/sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  pgdata:
