name: Build Debug APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PoojaSeva
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APKs (dev = emulator, prod = public backend)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDevDebug :app:assembleProdDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: poojaseva-apks
          path: PoojaSeva/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
