# Render Blueprint — deploys the PoojaSeva backend (FastAPI) + a Postgres DB.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting this repo in Render (New + > Blueprint), set RESEND_API_KEY
# (and optionally EMAIL_FROM / ADMIN_PHONES) in the dashboard — they are
# marked `sync: false` so they are NOT stored in git.
# Email is sent via the Resend HTTP API because Render blocks outbound SMTP.

databases:
  - name: poojaseva-db
    databaseName: poojaseva
    user: poojaseva
    plan: free

services:
  - type: web
    name: poojaseva-api
    runtime: docker
    plan: free
    dockerfilePath: PoojaSeva/backend/Dockerfile
    dockerContext: PoojaSeva/backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poojaseva-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: OTP_MODE
        value: email
      - key: OTP_EXPIRES_MINUTES
        value: "5"
      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: "60"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "PoojaSeva <onboarding@resend.dev>"
      - key: ADMIN_PHONES
        sync: false
