# Render Blueprint — deploys the PoojaSeva backend (FastAPI) + a Postgres DB.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting this repo in Render (New + > Blueprint), set the three
# SMTP secrets (and optionally ADMIN_PHONES) in the dashboard — they are
# marked `sync: false` so they are NOT stored in git.

databases:
  - name: poojaseva-db
    databaseName: poojaseva
    user: poojaseva
    plan: free

services:
  - type: web
    name: poojaseva-api
    runtime: docker
    plan: free
    dockerfilePath: PoojaSeva/backend/Dockerfile
    dockerContext: PoojaSeva/backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poojaseva-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: OTP_MODE
        value: email
      - key: OTP_EXPIRES_MINUTES
        value: "5"
      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: "60"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_PHONES
        sync: false
